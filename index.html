<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game</title>
    <style>
      body {
        width: 100vw;
        height: 100vh;
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        display: block;
      }

      .crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        pointer-events: none;
        filter: drop-shadow(0 0 1px black);
      }

      .crosshair::before,
      .crosshair::after {
        content: "";
        grid-area: 1 / 1;
        background: white;
      }

      .crosshair::before {
        width: 14px;
        height: 2px;
      }

      .crosshair::after {
        width: 2px;
        height: 14px;
      }

      .interaction-hint {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(12, 16, 22, 0.85);
        color: white;
        font: 500 14px/1.4 system-ui, sans-serif;
        pointer-events: none;
      }

      .interaction-hint kbd {
        display: inline-block;
        margin-right: 5px;
        padding: 0 5px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 3px;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="crosshair" aria-hidden="true"></div>
    <div id="interaction-hint" class="interaction-hint" hidden>
      <kbd>E</kbd> <span id="interaction-action">Poberi</span>
    </div>
    <script type="importmap">
      {
        "imports": {
          "gl-matrix": "/node_modules/gl-matrix/esm/index.js"
        }
      }
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
