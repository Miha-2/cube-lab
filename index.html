<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game</title>
    <style>
      body {
        width: 100vw;
        height: 100vh;
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        display: block;
      }

      .crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        pointer-events: none;
        filter: drop-shadow(0 0 1px black);
      }

      .crosshair::before,
      .crosshair::after {
        content: "";
        grid-area: 1 / 1;
        background: white;
      }

      .crosshair::before {
        width: 14px;
        height: 2px;
      }

      .crosshair::after {
        width: 2px;
        height: 14px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="crosshair" aria-hidden="true"></div>
    <script type="importmap">
      {
        "imports": {
          "gl-matrix": "/node_modules/gl-matrix/esm/index.js"
        }
      }
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
